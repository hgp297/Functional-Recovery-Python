[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "atc138"
version = "1.4"
description = "Functional Recovery Assessment (ATC-138)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Dustin Cook", email = "dustin.cook@nist.gov"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy~=2.0",
  "pandas",
  "scipy",
  "matplotlib",
  "seaborn",
]

[project.scripts]
atc138 = "atc138.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
"Homepage" = "https://github.com/OpenPBEE/Functional-Recovery-Python"
"Bug Tracker" = "https://github.com/OpenPBEE/Functional-Recovery-Python/issues"
"Changelog" = "https://github.com/OpenPBEE/Functional-Recovery-Python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/atc138"]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/.DS_Store",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src/atc138",
  "/README.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/pyproject.toml",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/.DS_Store",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = [
    "integration: long-running tests comparing full model runs against reference data",
]
